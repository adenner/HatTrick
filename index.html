<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hat Trick</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#8844ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hat Trick" />

  <!-- ============================================================
       Google AdSense
       Replace ca-pub-XXXXXXXXXXXXXXXX with your Publisher ID.
       ============================================================ -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
          crossorigin="anonymous"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    #game-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    #gameCanvas {
      border: 2px solid #333;
      border-radius: 4px;
      cursor: crosshair;
      box-shadow: 0 0 40px rgba(100, 60, 200, 0.3);
      display: block;
      flex-shrink: 0;
    }

    /* --- Ad sidebar --- */
    #ad-sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-shrink: 0;
    }

    .ad-label {
      font-size: 10px;
      color: rgba(255,255,255,0.25);
      text-align: center;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    /* Skyscraper: 160×600 — sits beside the canvas */
    .ad-skyscraper {
      width: 160px;
      height: 600px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
    }

    /* Medium rectangle: 300×250 — below the skyscraper */
    .ad-rect {
      width: 300px;
      height: 250px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>

    <div id="ad-sidebar">
      <!-- ============================================================
           Ad slot 1 — 160×600 Wide Skyscraper
           Replace data-ad-slot with your Ad Unit ID.
           ============================================================ -->
      <div>
        <p class="ad-label">Advertisement</p>
        <div class="ad-skyscraper">
          <ins class="adsbygoogle"
               style="display:block;width:160px;height:600px"
               data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
               data-ad-slot="XXXXXXXXXX"
               data-ad-format="fixed"></ins>
        </div>
      </div>

      <!-- ============================================================
           Ad slot 2 — 300×250 Medium Rectangle (optional second unit)
           Remove this block if you only want one ad.
           ============================================================ -->
      <div>
        <p class="ad-label">Advertisement</p>
        <div class="ad-rect">
          <ins class="adsbygoogle"
               style="display:block;width:300px;height:250px"
               data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
               data-ad-slot="XXXXXXXXXX"
               data-ad-format="fixed"></ins>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Push each ad unit. AdSense requires one push() call per <ins> tag.
    (adsbygoogle = window.adsbygoogle || []).push({});
    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
